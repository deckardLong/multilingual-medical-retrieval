[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r2ai-corpus-crawler-a"
version = "0.1.0"
description = "Respectful, resumable VI/ZH corpus crawler for member A"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "langdetect>=1.0.9",
  "pyarrow>=16",
  "protego>=0.3",
  "trafilatura>=1.8",
  "zstandard>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
