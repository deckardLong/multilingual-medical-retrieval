# Decompose
decompose:
  mode: rule
  max_subqueries: 4
  keep_original: true
  min_part_tokens: 4

# Search
search:
  k_dense: 100
  k_sparse: 100
  k_fuse: 60
  k_pool: 80
  langs: null
  rrf_k: 60
  hnsw_ef: 128
  rescore: true
  oversampling: 2.0

# Select
select:
  max_docs: 10
  min_score: null
  rel_drop: 0.5
  chunks_per_doc: 3